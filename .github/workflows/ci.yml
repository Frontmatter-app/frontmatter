name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Frontend (types + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs no lifecycle build here, so this does not trigger the
      # predev/prebuild test hooks. Steps below run the suites explicitly.
      - run: npm ci

      - name: Typecheck
        run: npm run lint

      # Fails if src/ipc/generated.ts is stale relative to the Rust commands.
      # Included in the vitest run, called out here because it is the step most
      # likely to surprise a contributor.
      - name: Test (vitest, includes IPC contract drift check)
        run: npm run test:web

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The theme build tests invoke the real zola binary and SKIP THEMSELVES
      # when it is absent. Without this step CI would report green while never
      # building a single theme.
      - name: Fetch bundled Zola
        run: ./scripts/fetch-zola.sh

      - name: Test
        run: npm run test:rust

  server:
    name: Server (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r server/requirements.txt pytest pytest-asyncio httpx
      - run: python -m pytest tests -q
        working-directory: server

  container:
    name: Container (real deployment artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is the job that matters most: it builds the same image a
      # self-hoster runs and drives it over HTTP and a real websocket. The
      # pytest job above exercises the app in-process, which cannot catch
      # packaging faults — a config value that only fails when it arrives from
      # the environment, a missing file in the image, a wrong working
      # directory. One such bug (FM_CORS_ORIGINS) was found by the container
      # and invisible to the in-process tests.
      - name: Build the image
        run: docker compose build

      - name: Start it
        run: docker compose up -d

      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::server never became healthy"
          docker compose logs server
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the running server
        run: |
          pip install websockets pycrdt
          ./scripts/verify-server.sh http://localhost:8000

      - name: Server logs
        if: always()
        run: docker compose logs server

      - name: Stop
        if: always()
        run: docker compose down -v

  licenses:
    name: License hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required license files are present
        run: |
          set -e
          for f in LICENSE NOTICE src-tauri/binaries/LICENSE-zola; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done

      - name: LICENSE is unmodified AGPL-3.0
        run: |
          curl -sSfL https://www.gnu.org/licenses/agpl-3.0.txt -o /tmp/agpl.txt
          diff -q LICENSE /tmp/agpl.txt \
            || { echo "::error::LICENSE differs from the canonical AGPL-3.0 text"; exit 1; }

      # The bundled Zola version is a licensing decision: Zola relicensed from
      # MIT to EUPL-1.2 after v0.19.2. Catch a bump that skips NOTICE.
      - name: Bundled Zola version matches NOTICE
        run: |
          pinned=$(grep -oE 'ZOLA_VERSION="v[0-9.]+"' scripts/fetch-zola.sh | grep -oE 'v[0-9.]+')
          grep -q "Zola ${pinned#v}" NOTICE \
            || { echo "::error::scripts/fetch-zola.sh pins ${pinned} but NOTICE does not mention it. Re-review the license before bumping."; exit 1; }
