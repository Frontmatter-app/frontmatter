[package]
name = "frontmatter"
version = "1.0.0"
description = "A markdown writing app where your documents are files in your own git repository."
authors = ["Frontmatter contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/frontmatter-app/frontmatter"
homepage = "https://frontmatter.app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools"] }
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "chrono"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.14"
notify = "6.1"
uuid = { version = "1.8", features = ["v4", "v5", "fast-rng", "macro-diagnostics"] }
tauri-plugin-fs = "2"
dirs = "5"
url = "2"
rand = "0.8"
pulldown-cmark = "0.11"
sha2 = "0.10"
regex = "1"
once_cell = "1"
tracing = "0.1"
linguist = "0.1.10"
serde_yaml = "0.9"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
harper-core = "2.8.0"

# HTTP for the OAuth device flow, which cannot run in the webview: the
# provider's device endpoints send no CORS headers. rustls rather than
# native-tls to avoid an OpenSSL build dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# OS secret store for git provider tokens. `apple-native`, `windows-native` and
# `sync-secret-service` select the platform backends; without a feature the
# crate compiles to a no-op store that silently keeps nothing.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

