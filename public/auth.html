<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Frontmatter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f11;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 380px;
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #71717a;
      font-size: 13px;
      margin-bottom: 32px;
    }

    #btn-google {
      width: 100%;
      padding: 13px 20px;
      background: #fff;
      color: #1a1a1a;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s, transform 0.1s;
    }

    #btn-google:hover { background: #f1f5f9; }
    #btn-google:active { transform: scale(0.98); }
    #btn-google:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 13px;
      min-height: 20px;
      color: #71717a;
    }

    #status.error { color: #f87171; }
    #status.success { color: #4ade80; }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.1);
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .google-icon {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Frontmatter</div>
    <p class="subtitle">Sign in to sync your work across devices</p>

    <button id="btn-google">
      <!-- Google "G" logo SVG -->
      <svg class="google-icon" width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      <span id="btn-label">Continue with Google</span>
      <span class="spinner" id="spinner"></span>
    </button>

    <div id="status"></div>
  </div>

  <!-- Firebase SDK (compat version for simplicity in a standalone HTML page) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    // ──────────────────────────────────────────────────────────────────────────
    // Firebase config — this page is deployed TO Firebase Hosting, so Google
    // Sign-In works perfectly here (no popup blocking, authorized domain).
    // ──────────────────────────────────────────────────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyB1n4Wki60Yc86SE0t76fvCSfY1pGxzfes",
      authDomain:        "marktype.firebaseapp.com",
      projectId:         "marktype",
      storageBucket:     "marktype.firebasestorage.app",
      messagingSenderId: "725195168208",
      appId:             "1:725195168208:web:f242108bf25abbc93cc1d5",
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const btn     = document.getElementById('btn-google');
    const label   = document.getElementById('btn-label');
    const spinner = document.getElementById('spinner');
    const status  = document.getElementById('status');

    function setLoading(loading) {
      btn.disabled = loading;
      spinner.style.display = loading ? 'inline-block' : 'none';
      label.textContent = loading ? 'Signing in…' : 'Continue with Google';
    }

    function setStatus(msg, type = '') {
      status.textContent = msg;
      status.className   = type;
    }

    btn.addEventListener('click', async () => {
      setLoading(true);
      setStatus('');
      try {
        const provider = new GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');

        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken     = credential?.idToken     || '';
        const accessToken = credential?.accessToken || '';

        setStatus('Signed in! Returning to Frontmatter…', 'success');

        // ── Send token back to the Tauri main window ──────────────────────
        // We store in localStorage as a fallback for the Tauri window to read,
        // then try postMessage, then close this window.
        const payload = {
          idToken,
          accessToken,
          uid:         result.user.uid,
          displayName: result.user.displayName,
          email:       result.user.email,
          photoURL:    result.user.photoURL,
        };

        // Primary: write to a well-known localStorage key the Tauri app polls
        try {
          window.localStorage.setItem('marktype_pending_auth', JSON.stringify(payload));
        } catch (_) {}

        // Secondary: postMessage to opener (works in dev mode where the opener is localhost)
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'marktype-auth', payload }, '*');
          }
        } catch (_) {}

        // Close this auth window after a short delay
        setTimeout(() => window.close(), 800);
      } catch (e) {
        console.error('Auth error:', e);
        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
          setStatus('Sign-in cancelled.', '');
        } else {
          setStatus('Sign-in failed: ' + (e.message || e.code), 'error');
        }
        setLoading(false);
      }
    });
  </script>
</body>
</html>
